<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Money</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0ea;--panel:#fbfbf8;--ink:#1b2a2e;--muted:#66756f;--line:#d5dad0;--in:#16755f;--out:#8a3a68;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Instrument Sans",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:20px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.6rem;margin:0;font-weight:700;letter-spacing:-.02em}
h2{font-size:1rem;margin:0 0 12px;font-weight:700}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r);padding:9px 16px;font-weight:500}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
:focus-visible{outline:3px solid #7ab8a8;outline-offset:1px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);padding:0;margin-bottom:12px}
.summary div{padding:14px 16px;border-right:1px solid var(--line)}
.summary div:last-child{border-right:0}
.summary small{color:var(--muted);display:block}
.summary b{font-size:1.15rem;font-variant-numeric:tabular-nums}
#insight{margin:0 0 16px;padding:12px 16px;border-left:4px solid var(--out);background:var(--panel);border-radius:0 var(--r) var(--r) 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.bar{display:grid;grid-template-columns:84px 1fr 44px;gap:8px;align-items:center;font-size:.9rem;margin:8px 0}
.bar i{display:block;height:10px;background:var(--out);border-radius:5px}
.bar small{color:var(--muted);grid-column:2/4;margin-top:-6px}
.bar em{font-style:normal;text-align:right;color:var(--muted)}
svg{width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:.85rem;color:var(--muted);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li small{color:var(--muted);display:block}
.amt{font-variant-numeric:tabular-nums;font-weight:500}
.income{color:var(--in)}.expense{color:var(--out)}
li button{padding:4px 9px;font-size:.85rem}
#msg{min-height:1.4em;font-size:.9rem;color:var(--muted);margin:0 0 10px}
#msg.err{color:#a02323}
#fab{position:fixed;right:18px;bottom:18px;font-size:1.05rem;padding:14px 22px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
dialog{border:1px solid var(--line);border-radius:var(--r);max-width:440px;width:calc(100% - 24px);background:var(--panel)}
dialog::backdrop{background:rgba(20,30,30,.45)}
form>*{margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg label{margin:0;padding:9px;text-align:center;cursor:pointer;color:var(--ink)}
.seg input{position:absolute;opacity:0;width:0}
.seg label:has(input:checked){background:var(--ink);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:#fff;color:var(--ink);border-color:var(--line);padding:7px 13px}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
[hidden]{display:none!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.two{grid-template-columns:1fr}.summary b{font-size:1rem}}
</style>
</head>
<body>
<main>
  <header>
    <h1>My Money</h1>
    <div style="display:flex;gap:8px">
      <input type="month" id="month" aria-label="Month" style="width:auto">
      <button class="ghost" id="openSettings">Settings</button>
    </div>
  </header>
  <p id="msg" role="status"></p>

  <section class="panel summary" aria-label="Month summary">
    <div><small>Income</small><b id="sIn" class="income">Rp 0</b></div>
    <div><small>Spending</small><b id="sOut" class="expense">Rp 0</b></div>
    <div><small>Left over</small><b id="sNet">Rp 0</b></div>
  </section>
  <p id="insight">Add your first entry to see insights.</p>

  <div class="two">
    <section class="panel"><h2>Where the money went</h2><div id="cats"></div></section>
    <section class="panel"><h2>Last 6 months</h2><div id="trend"></div>
      <div class="legend"><span style="--c:var(--in)">Income</span><span style="--c:var(--out)">Spending</span></div>
    </section>
  </div>

  <section class="panel"><h2>Entries</h2><ul id="list"></ul></section>
</main>

<button id="fab">+ Add</button>

<dialog id="addDlg">
  <form id="form">
    <h2>New entry</h2>
    <div class="seg" role="radiogroup" aria-label="Type">
      <label><input type="radio" name="type" value="expense" checked>Spending</label>
      <label><input type="radio" name="type" value="income">Income</label>
    </div>
    <div class="row2">
      <div><label for="amount">Amount (Rp)</label><input type="number" id="amount" min="1" step="any" inputmode="numeric" required></div>
      <div><label for="date">Date</label><input type="date" id="date" required></div>
    </div>
    <div><label for="category">Category</label><select id="category"></select></div>
    <div id="newCatRow" hidden style="display:flex;gap:8px">
      <input type="text" id="newCat" maxlength="30" placeholder="New category name" aria-label="New category name">
      <button type="button" id="addCat">Add</button>
    </div>
    <div><label for="note">What was it for?</label><input type="text" id="note" maxlength="120" placeholder="e.g. lunch with friends"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="ghost" id="cancelAdd">Cancel</button>
      <button type="submit" id="save">Save entry</button>
    </div>
  </form>
</dialog>

<dialog id="settings">
  <form id="cfgForm" novalidate>
    <h2>Google Sheets connection</h2>
    <div><label for="url">Apps Script web app URL</label><input type="url" id="url" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div><label for="key">Passphrase (same as SECRET in Code.gs)</label><input type="password" id="key"></div>
    <p id="cfgErr" style="color:#a02323;font-size:.9rem;margin:0 0 12px"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button type="button" class="ghost" id="cancelCfg">Cancel</button>
      <button type="submit">Save and load</button>
    </div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const CATS = {
  expense: ['Food','Transport','Rent','Bills','Shopping','Health','Education','Other'],
  income: ['Salary','Freelance','Gift','Other']
};
let entries = [], chosenCat = 'Food';

const idr = n => (n < 0 ? '-' : '') + 'Rp ' + Math.round(Math.abs(n)).toLocaleString('id-ID');
let mem = null;
const cfg = () => { if (mem) return mem; try { return JSON.parse(localStorage.getItem('cfg') || '{}'); } catch { return {}; } };
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const type = () => document.querySelector('input[name=type]:checked').value;
function say(t, err) { const m = $('#msg'); m.textContent = t; m.className = err ? 'err' : ''; }

async function api(body) {
  const { url, key } = cfg();
  if (!url) throw new Error('Add your Apps Script URL in Settings first.');
  const res = body
    ? await fetch(url, { method: 'POST', body: JSON.stringify({ ...body, key }) })
    : await fetch(url + '?key=' + encodeURIComponent(key || ''));
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function load() {
  try { say('Loading from Google Sheets...'); entries = (await api()).entries; say(''); }
  catch (e) { say(e.message, true); }
  render();
}

const sumOf = (rows, t) => rows.filter(e => e.type === t).reduce((a, e) => a + e.amount, 0);

function render() {
  const month = $('#month').value;
  const rows = entries.filter(e => e.date.startsWith(month)).sort((a, b) => b.date.localeCompare(a.date));
  const inc = sumOf(rows, 'income'), out = sumOf(rows, 'expense');
  $('#sIn').textContent = idr(inc);
  $('#sOut').textContent = idr(out);
  $('#sNet').textContent = idr(inc - out);

  const by = {};
  rows.filter(e => e.type === 'expense').forEach(e => by[e.category] = (by[e.category] || 0) + e.amount);
  const sorted = Object.entries(by).sort((a, b) => b[1] - a[1]);
  $('#cats').innerHTML = sorted.length
    ? sorted.map(([c, v]) => `<div class="bar"><span>${esc(c)}</span><i style="width:${v / sorted[0][1] * 100}%"></i><em>${Math.round(v / out * 100)}%</em><small>${idr(v)}</small></div>`).join('')
    : '<p style="color:var(--muted);margin:0">No spending this month yet.</p>';

  if (sorted.length) {
    const [c, v] = sorted[0];
    const [y, m] = month.split('-').map(Number);
    const isNow = month === today().slice(0, 7);
    const days = isNow ? new Date().getDate() : new Date(y, m, 0).getDate();
    let t = `Biggest spending is ${c}: ${idr(v)}, ${Math.round(v / out * 100)}% of the month. You spend about ${idr(out / days)} per day.`;
    if (inc > 0) t += ` You kept ${Math.round((inc - out) / inc * 100)}% of your income.`;
    $('#insight').textContent = t;
  } else $('#insight').textContent = 'Add your first entry to see insights.';

  drawTrend(month);

  $('#list').innerHTML = rows.length
    ? rows.map(e => `<li><div>${esc(e.category)}<small>${esc(e.date)}${e.note ? ' · ' + esc(e.note) : ''}</small></div>
        <span class="amt ${e.type}">${e.type === 'income' ? '+' : '-'}${idr(e.amount)}</span>
        <button class="ghost" data-del="${esc(e.id)}" aria-label="Delete entry">Delete</button></li>`).join('')
    : '<li style="color:var(--muted)">Nothing recorded for this month.</li>';
}

function drawTrend(month) {
  const [y, m] = month.split('-').map(Number);
  const data = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(y, m - 1 - i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const rows = entries.filter(e => e.date.startsWith(key));
    data.push({ label: d.toLocaleString('en', { month: 'short' }), inc: sumOf(rows, 'income'), out: sumOf(rows, 'expense') });
  }
  const max = Math.max(1, ...data.flatMap(d => [d.inc, d.out]));
  $('#trend').innerHTML = `<svg viewBox="0 0 360 150" role="img" aria-label="Income and spending for the last 6 months">` +
    data.map((d, i) => {
      const x = i * 60 + 8, hi = d.inc / max * 110, ho = d.out / max * 110;
      return `<rect x="${x}" y="${120 - hi}" width="20" height="${hi}" rx="3" fill="var(--in)"/>
        <rect x="${x + 24}" y="${120 - ho}" width="20" height="${ho}" rx="3" fill="var(--out)"/>
        <text x="${x + 22}" y="140" text-anchor="middle" font-size="12" fill="var(--muted)">${d.label}</text>`;
    }).join('') + '</svg>';
}

const custom = () => { try { return JSON.parse(localStorage.getItem('cats') || '{}'); } catch { return {}; } };
function fillCats(pick) {
  const t = type();
  const list = [...new Set([...CATS[t], ...(custom()[t] || []), ...entries.filter(e => e.type === t).map(e => e.category)])];
  if (pick) chosenCat = pick;
  if (!list.includes(chosenCat)) chosenCat = list[0];
  $('#category').innerHTML = list.map(c => `<option value="${esc(c)}"${c === chosenCat ? ' selected' : ''}>${esc(c)}</option>`).join('')
    + '<option value="__new">+ Add new category...</option>';
}
$('#category').addEventListener('change', e => {
  if (e.target.value === '__new') { $('#newCatRow').hidden = false; $('#newCat').focus(); }
  else { chosenCat = e.target.value; $('#newCatRow').hidden = true; }
});
function addCategory() {
  const name = $('#newCat').value.trim();
  if (!name) return;
  const c = custom(), t = type();
  c[t] = [...new Set([...(c[t] || []), name])];
  localStorage.setItem('cats', JSON.stringify(c));
  $('#newCat').value = ''; $('#newCatRow').hidden = true;
  fillCats(name);
}
$('#addCat').onclick = addCategory;
$('#newCat').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCategory(); } });
document.querySelectorAll('input[name=type]').forEach(r => r.addEventListener('change', () => { $('#newCatRow').hidden = true; fillCats(); }));
$('#month').addEventListener('change', render);

$('#fab').onclick = () => { $('#date').value = today(); $('#newCatRow').hidden = true; fillCats(); $('#addDlg').showModal(); $('#amount').focus(); };
$('#cancelAdd').onclick = () => $('#addDlg').close();

$('#form').addEventListener('submit', async ev => {
  ev.preventDefault();
  if ($('#category').value === '__new') { $('#newCat').focus(); return; }
  const entry = { action: 'add', date: $('#date').value, type: type(), category: chosenCat, amount: Number($('#amount').value), note: $('#note').value.trim() };
  $('#save').disabled = true;
  try {
    const { id } = await api(entry);
    entries.push({ ...entry, id });
    $('#amount').value = ''; $('#note').value = '';
    $('#addDlg').close();
    say('Entry saved.');
    render();
  } catch (e) { say(e.message, true); $('#addDlg').close(); }
  $('#save').disabled = false;
});

$('#list').addEventListener('click', async ev => {
  const id = ev.target.dataset.del;
  if (!id || !confirm('Delete this entry from your sheet?')) return;
  try { await api({ action: 'delete', id }); entries = entries.filter(e => e.id !== id); render(); }
  catch (e) { say(e.message, true); }
});

const dlg = $('#settings');
$('#openSettings').onclick = () => { $('#url').value = cfg().url || ''; $('#key').value = cfg().key || ''; dlg.showModal(); };
$('#cancelCfg').onclick = () => dlg.close();
$('#cfgForm').addEventListener('submit', ev => {
  ev.preventDefault();
  const url = $('#url').value.trim().split('?')[0];
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(url)) {
    $('#cfgErr').textContent = 'The URL must start with https://script.google.com/macros/s/ and end with /exec';
    return;
  }
  $('#cfgErr').textContent = '';
  mem = { url, key: $('#key').value };
  try { localStorage.setItem('cfg', JSON.stringify(mem)); }
  catch { say('This browser blocked saving your settings, so they will be forgotten when you close the page.', true); }
  dlg.close(); load();
});

$('#month').value = today().slice(0, 7);
render();
if (cfg().url) load(); else say('Connect your Google Sheet in Settings to start.');
</script>
</body>
</html>
